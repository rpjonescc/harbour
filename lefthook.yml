pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{ts,tsx,mts,mjs,js,json,css}"
      run: pnpm biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    files:
      run: pnpm check:files
    private:
      run: pnpm check:private --require-terms
pre-push:
  # Scripts (in .lefthook/pre-push/) rather than commands: lefthook skips pre-push commands
  # when the pushed tree matches the remote, which would let add-then-remove leaks through.
  scripts:
    "private.sh":
      runner: sh
      # git passes the refs being pushed on stdin; the scan derives its commit ranges from them.
      use_stdin: true
    "check.sh":
      runner: sh
