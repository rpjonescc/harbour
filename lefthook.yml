pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{ts,tsx,mts,mjs,js,json,css}"
      run: pnpm biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    files:
      run: pnpm check:files
    private:
      run: pnpm check:private --require-terms
pre-push:
  commands:
    private:
      run: pnpm check:private --commits
      # git passes the refs being pushed on stdin; the scan derives its commit ranges from them.
      use_stdin: true
    check:
      run: pnpm check
